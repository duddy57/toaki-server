<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Recuperação de Senha</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<h2>Olá, {{.Name}}!</h2>
<p>Recebemos uma solicitação para redefinir a sua senha.</p>
<p>Clique no botão abaixo para criar uma nova senha:</p>
<p>
    <a href="{{.RedirectLink}}" style="background-color: #007bff; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 4px; display: inline-block;">Redefinir Senha</a>
</p>
<p><small>Este link expira em {{.ExpiresIn}}.</small></p>
<p>Se você não solicitou isso, ignore este e-mail.</p>
</body>
</html>
